function localDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function todayStr(offset) {
  offset = offset || 0;

  d.setDate(d.getDate() + offset);

}
function startOfWeek(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return localDateStr(d);
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

}

function startOfMonth(dateStr) { return dateStr.slice(0, 7) + "-01"; }

function fmtPhp(n) { return "\u20b1" + Math.round(n || 0).toLocaleString(); }
function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function withRetry(fn, retries) {

}
function nextWeekdayStr(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return localDateStr(d);
}
function bestStreakFrom(entriesMap) {
  var dates = Object.keys(entriesMap).filter(function (d) {
    var dow = new Date(d + "T00:00:00").getDay();
    return dow !== 0 && dow !== 6;
  }).sort();
  var best = 0, run = 0, prev = null;
  dates.forEach(function (d) {
    run = (prev && d === nextWeekdayStr(prev)) ? run + 1 : 1;
    if (run > best) best = run;
    prev = d;
  });
  return best;
}
function currentStreakFrom(entriesMap) {
  var count = 0, offset = 0;
  while (offset < 400) {
    var d = new Date(); d.setDate(d.getDate() - offset);
    var dow = d.getDay();
    if (dow === 0 || dow === 6) { offset++; continue; }
    var ds = localDateStr(d);
    if (entriesMap[ds]) { count++; offset++; }
    else if (offset === 0) { offset++; }
    else break;
  }
  return count;
}

              return h("div", { key: row.kpi_key, style: { background: COLORS.card, borderColor: COLORS.line }, className: "rounded-2xl border p-4" },
                h("div", { className: "flex items-baseline justify-between mb-1.5" },
                  h("div", { style: { color: COLORS.ink }, className: "font-medium text-sm" }, row.label),
                  h("div", { style: { color: COLORS.slate }, className: "text-[11px] font-mono" }, fmtKpiValue(row) + " / " + fmtKpiTarget(row))
                ),
                h("div", { style: { background: COLORS.parchment }, className: "h-2 rounded-full overflow-hidden" },
                  h("div", { style: { width: pct + "%", background: (row.pct_of_target || 0) >= 100 ? COLORS.good : COLORS.brass }, className: "h-full rounded-full" })
                ),
                h("div", { style: { color: COLORS.slate }, className: "text-[10px] mt-1" }, Math.round(row.pct_of_target || 0) + "% of target \u00b7 " + row.weight_pct + "% weight")
              );
            })
          )
    )
  );
}
 
function SectionTitle(props) {
  return h("div", { className: props.bare ? "" : "mb-2.5" }, h("span", { style: { color: COLORS.ink }, className: "font-display text-base" }, props.label));
}
 
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
