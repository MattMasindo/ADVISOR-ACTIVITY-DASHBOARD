<script>
(function () {
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;
var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
 
var COLORS = {
  ink: "#EDEFF5", inkLight: "#2DD4BF", parchment: "#0F131B", card: "#171D29",
  brass: "#F2B705", brassLight: "#F7CB55", slate: "#8891A6", rust: "#E24B4A",
  line: "#2A3244", good: "#2DD4BF", emphasis: "#FF6A3D"
};
 
var METRICS = [
  { key: "prospecting", label: "New Prospects", short: "Prospecting", color: COLORS.slate },
  { key: "approaching", label: "Initial Approaches", short: "Approaching", color: COLORS.brassLight },
  { key: "relationship", label: "Relationship Touches", short: "Relationship", color: COLORS.inkLight },
  { key: "appts", label: "Appointments Set", short: "Appointments", color: COLORS.brass },
  { key: "presented", label: "Clients Presented", short: "Presented", color: COLORS.ink },
  { key: "closed", label: "Clients Closed", short: "Closed", color: COLORS.rust }
];
 
function localDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function todayStr(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return localDateStr(d);
}
function startOfWeek(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return localDateStr(d);
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
function shortDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function emptyEntry() {
  var row = { social: false, note: "", fyp: 0 };
  METRICS.forEach(function (m) { row[m.key] = 0; });
  return row;
}
function entryTotal(e) {
  if (!e) return 0;
  return METRICS.reduce(function (s, m) { return s + (e[m.key] || 0); }, 0);
}
function lget(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (err) { return null; } }
function lset(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) {} }
function startOfMonth(dateStr) { return dateStr.slice(0, 7) + "-01"; }
function weekdayLabel(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()];
}
function isFullFunnel(e) {
  return !!e && (e.prospecting || 0) >= 1 && (e.relationship || 0) >= 1 && !!e.social;
}
function referralStatus(r) {
  if (r.retained_paid) return "Fully paid";
  if (r.retained_90) return "Retained \u2014 90 day";
  if (r.apps_3) return "Coded \u2014 3 apps";
  if (r.contract_signed) return "Signed \u2014 contract";
  return "Referred";
}
function daysSince(isoTimestamp) {
  if (!isoTimestamp) return null;
  var then = new Date(isoTimestamp); then.setHours(0, 0, 0, 0);
  var now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((now - then) / 86400000);
}
function referralPayout(r) {
  return (r.signed_paid ? 500 : 0) + (r.coded_paid ? 1000 : 0) + (r.retained_paid ? 1500 : 0);
}
var LANE_MINIMUMS = { grind: 15 };
 
function laneBasisText(laneKey, value) {
  if (laneKey === "grosser") return fmtPhp(value) + " settled FYP";
  if (laneKey === "pipeline") return value + " prospects + approaches";
  if (laneKey === "grind") return value + " clients presented";
  return String(value);
}
 
// Returns the itemised REASONS an advisor is owed money. computeReceivable
// sums these, so the headline figure and the breakdown can never disagree.
function receivableItems(code, referrals, monthBoards) {
  var items = [];
  referrals.filter(function (r) { return r.recipient_code === code; }).forEach(function (r) {
    var who = r.candidate_name || "referral";
    if (r.contract_signed && !r.signed_paid) items.push({ kind: "confirmed", amount: 500,  label: "Contract signed", detail: who });
    if (r.apps_3 && !r.coded_paid)           items.push({ kind: "confirmed", amount: 1000, label: "3 apps / coded",   detail: who });
    if (r.retained_90 && !r.retained_paid)   items.push({ kind: "confirmed", amount: 1500, label: "Retained 90 days", detail: who });
  });
  LANES.forEach(function (lane) {
    var rows = monthBoards[lane.key] || [];
    var leader = rows.length ? rows[0] : null;
    if (!leader || leader.code !== code || !(leader[lane.key] > 0)) return;
    var min = LANE_MINIMUMS[lane.key];
    items.push({
      kind: "projected",
      amount: LANE_AMOUNTS[lane.key],
      label: "Leading " + lane.label,
      detail: laneBasisText(lane.key, leader[lane.key]),
      belowMin: min != null && leader[lane.key] < min ? min : null
    });
  });
  return items;
}
 
function computeReceivable(code, referrals, monthBoards) {

        style: { borderColor: COLORS.line, background: COLORS.parchment, color: COLORS.ink },
        className: "w-full px-3 py-2.5 rounded-xl border outline-none focus:ring-2 text-sm"
      }),
      error && h("div", { style: { color: COLORS.rust }, className: "text-xs" }, error),
      justSaved && h("div", { style: { color: COLORS.good }, className: "text-xs" }, "Submitted \u2014 waiting for manager verification."),
      h("button", {
        onClick: submit, disabled: busy,
        style: { background: busy ? COLORS.line : COLORS.emphasis, opacity: busy ? 0.7 : 1 },
        className: "w-full py-2.5 rounded-xl text-white text-sm font-semibold active:scale-[0.98] transition-transform"
      }, busy ? "Saving\u2026" : "Add submission")
    ),
 
    h("div", { className: "flex items-center gap-4 mt-4 pt-3", style: { borderTop: "1px solid " + COLORS.line } },
      h("div", null,
        h("div", { style: { color: COLORS.slate }, className: "text-[10px] font-mono uppercase tracking-wide" }, "Submitted (mo)"),
        h("div", { style: { color: COLORS.ink }, className: "font-mono text-sm" }, fmtPhp(props.monthSubmittedMine))
      ),
      h("div", null,
        h("div", { style: { color: COLORS.slate }, className: "text-[10px] font-mono uppercase tracking-wide" }, "Settled (mo)"),
        h("div", { style: { color: COLORS.good }, className: "font-mono text-sm" }, fmtPhp(props.monthSettledMine))
      )
    ),
 
    recent.length > 0 && h("div", { className: "mt-3 space-y-1.5" },
      recent.map(function (s) {
        return h("div", {
          key: s.id,
          style: { background: COLORS.parchment, borderColor: COLORS.line },
          className: "rounded-xl border px-3 py-2 flex items-center justify-between gap-2"
        },
          h("div", { className: "min-w-0" },
            h("div", { style: { color: COLORS.ink }, className: "font-mono text-[13px]" }, fmtPhp(s.amount)),
            h("div", { style: { color: COLORS.slate }, className: "text-[10px] font-mono truncate" },
              s.app_serial + (s.client_name ? " \u00b7 " + s.client_name : ""))
          ),
          h("div", {
            style: { color: s.settled ? COLORS.good : COLORS.brass },
            className: "text-[10px] font-mono uppercase tracking-wide shrink-0"
          }, s.settled ? "\u2713 Settled" : "Pending")
        );
      })
    )
  );
}
 
function SectionTitle(props) {
  return h("div", { className: props.bare ? "" : "mb-2.5" }, h("span", { style: { color: COLORS.ink }, className: "font-display text-base" }, props.label));
}
 
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
