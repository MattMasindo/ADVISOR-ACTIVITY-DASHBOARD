<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo } = React;
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const COLORS = {
  ink: "#1F3D34", inkLight: "#2E5548", parchment: "#EEF0E8", card: "#FBFBF7",
  brass: "#B8863B", brassLight: "#D9B26B", slate: "#52606D", rust: "#A3502B",
  line: "#DDE1D2", good: "#3E7A4C",
};

const METRICS = [
  { key: "prospecting", label: "New Prospects", short: "Prospecting", color: COLORS.slate },
  { key: "approaching", label: "Initial Approaches", short: "Approaching", color: COLORS.brassLight },
  { key: "relationship", label: "Relationship Touches", short: "Relationship", color: COLORS.inkLight },
  { key: "appts", label: "Appointments Set", short: "Appointments", color: COLORS.brass },
  { key: "presented", label: "Clients Presented", short: "Presented", color: COLORS.ink },
  { key: "closed", label: "Clients Closed", short: "Closed", color: COLORS.rust },
];

function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function startOfWeek(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d.toISOString().slice(0, 10);
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
function shortDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function emptyEntry() {
  const row = { social: false, note: "" };
  METRICS.forEach((m) => (row[m.key] = 0));
  return row;
}
function entryTotal(e) {
  if (!e) return 0;
  return METRICS.reduce((s, m) => s + (e[m.key] || 0), 0);
}
function lget(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function lset(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

function App() {
  const [loading, setLoading] = useState(true);
  const [dbError, setDbError] = useState(null);
  const [myIdentity, setMyIdentity] = useState(lget("my-identity"));
  const [roster, setRoster] = useState([]);
  const [targets, setTargets] = useState({});
  const [hasManagerPin, setHasManagerPin] = useState(false);
  const [isManager, setIsManager] = useState(!!lget("is-manager"));
  const [myEntries, setMyEntries] = useState({});
  const [teamEntries, setTeamEntries] = useState([]);
  const [teamLoading, setTeamLoading] = useState(false);
  const [view, setView] = useState("log");
  const [switching, setSwitching] = useState(false);
  const [pulse, setPulse] = useState(null);
  const [showManagerGate, setShowManagerGate] = useState(false);
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    (async () => {
      const [{ data: rosterData, error: e1 }, { data: targetData, error: e2 }, { data: hasPinData, error: e3 }] =
        await Promise.all([
          sb.from("advisors").select("*").order("name"),
          sb.from("targets").select("*"),
          sb.rpc("has_manager_pin"),
        ]);
      if (e1 || e2 || e3) {
        setDbError("Couldn't reach the database. Check that your Supabase URL and key are filled in at the top of index.html, and that schema.sql has been run.");
        setLoading(false);
        return;
      }
      setRoster(rosterData || []);
      const tMap = {};
      (targetData || []).forEach((t) => (tMap[t.stage] = t.daily_target));
      setTargets(tMap);
      setHasManagerPin(!!hasPinData);

      if (myIdentity) {
        const { data } = await sb.from("entries").select("*").eq("advisor_code", myIdentity.code);
        const map = {};
        (data || []).forEach((row) => (map[row.entry_date] = row));
        setMyEntries(map);
      }
      setLoading(false);
    })();
    // eslint-disable-next-line
  }, []);

  const loadTeamData = async () => {
    setTeamLoading(true);
    const { data } = await sb.from("entries").select("*");
    setTeamEntries(data || []);
    setTeamLoading(false);
  };

  useEffect(() => {
    if (view === "team" || view === "manager") loadTeamData();
    // eslint-disable-next-line
  }, [view]);

  const chooseAdvisor = async (identity) => {
    setMyIdentity(identity);
    lset("my-identity", identity);
    setSwitching(false);
    const { data } = await sb.from("entries").select("*").eq("advisor_code", identity.code);
    const map = {};
    (data || []).forEach((row) => (map[row.entry_date] = row));
    setMyEntries(map);
  };

  const createAdvisor = async ({ name, code }) => {
    const { error } = await sb.from("advisors").insert({ name, code });
    if (error) return { ok: false, message: error.code === "23505" ? "That code is already taken — pick another." : "Couldn't save. Try again." };
    setRoster([...roster, { name, code }]);
    await chooseAdvisor({ name, code });
    return { ok: true };
  };

  const today = todayStr();
  const myCode = myIdentity?.code;
  const myTodayEntry = myEntries[today] || emptyEntry();

  const bump = async (key, delta) => {
    const optimistic = { ...myTodayEntry, [key]: Math.max(0, (myTodayEntry[key] || 0) + delta) };
    setMyEntries({ ...myEntries, [today]: optimistic });
    setPulse(key);
    setTimeout(() => setPulse(null), 500);
    const { error } = await sb.rpc("bump_metric", { p_code: myCode, p_date: today, p_field: key, p_delta: delta });
    setSaveError(!!error);
    if (!error) {
      const { data } = await sb.from("entries").select("*").eq("advisor_code", myCode).eq("entry_date", today).single();
      if (data) setMyEntries((prev) => ({ ...prev, [today]: data }));
    }
  };

  const upsertField = async (fields) => {
    const updated = { ...myTodayEntry, ...fields, advisor_code: myCode, entry_date: today };
    setMyEntries({ ...myEntries, [today]: updated });
    const { error } = await sb.from("entries").upsert(updated, { onConflict: "advisor_code,entry_date" });
    setSaveError(!!error);
  };

  const saveTargets = async (draft) => {
    setTargets(draft);
    await Promise.all(Object.entries(draft).map(([stage, daily_target]) =>
      sb.from("targets").upsert({ stage, daily_target }, { onConflict: "stage" })
    ));
  };

  const unlockManager = async (pin) => {
    if (!hasManagerPin) {
      const { data: setOk } = await sb.rpc("set_manager_pin_if_unset", { p_pin: pin });
      if (!setOk) return false; // someone else set it a moment before you — ask them to re-enter as a login instead
      setHasManagerPin(true);
      setIsManager(true); lset("is-manager", true);
      setShowManagerGate(false); setView("manager");
      return true;
    }
    const { data: matches } = await sb.rpc("check_manager_pin", { p_candidate: pin });
    if (matches) {
      setIsManager(true); lset("is-manager", true);
      setShowManagerGate(false); setView("manager");
      return true;
    }
    return false;
  };

  const todayRows = teamEntries.filter((e) => e.entry_date === today);
  const todayTotals = METRICS.reduce((acc, m) => { acc[m.key] = todayRows.reduce((s, e) => s + (e[m.key] || 0), 0); return acc; }, {});
  const socialToday = todayRows.filter((e) => e.social).length;

  const weekStart = startOfWeek(today);
  const weekRows = teamEntries.filter((e) => e.entry_date >= weekStart && e.entry_date <= today);
  const board = {};
  weekRows.forEach((e) => {
    if (!board[e.advisor_code]) {
      const advisor = roster.find((r) => r.code === e.advisor_code);
      board[e.advisor_code] = { code: e.advisor_code, name: advisor ? advisor.name : e.advisor_code, social: 0 };
    }
    METRICS.forEach((m) => (board[e.advisor_code][m.key] = (board[e.advisor_code][m.key] || 0) + (e[m.key] || 0)));
    if (e.social) board[e.advisor_code].social += 1;
  });
  const leaderboard = Object.values(board).sort((a, b) => (b.closed || 0) - (a.closed || 0) || (b.appts || 0) - (a.appts || 0));

  const last7 = Array.from({ length: 7 }, (_, i) => todayStr(-6 + i));
  const trendData = last7.map((d) => {
    const rows = teamEntries.filter((e) => e.entry_date === d);
    const point = { date: d, label: new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "short" }) };
    METRICS.forEach((m) => (point[m.key] = rows.reduce((s, e) => s + (e[m.key] || 0), 0)));
    return point;
  });

  const funnelData = METRICS.map((m) => ({ ...m, value: todayTotals[m.key] || 0 }));
  const missingToday = roster.filter((r) => entryTotal(todayRows.find((e) => e.advisor_code === r.code)) === 0);
  const loggedTodayCount = roster.length - missingToday.length;

  if (dbError) {
    return (
      <div style={{ background: COLORS.parchment, minHeight: "100vh" }} className="flex items-center justify-center px-6">
        <div style={{ background: COLORS.card, borderColor: COLORS.line, color: COLORS.rust }} className="max-w-sm rounded-2xl border p-5 text-sm">{dbError}</div>
      </div>
    );
  }
  if (loading) {
    return (
      <div style={{ background: COLORS.parchment, minHeight: "100vh" }} className="flex items-center justify-center">
        <div style={{ color: COLORS.ink }} className="text-sm tracking-widest uppercase font-mono">Loading ledger…</div>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.parchment, minHeight: "100vh" }}>
      {(!myIdentity || switching) ? (
        <Onboarding roster={roster} onChoose={chooseAdvisor} onCreate={createAdvisor} cancelable={!!myIdentity} onCancel={() => setSwitching(false)} />
      ) : (
        <div className="max-w-md mx-auto pb-10">
          <div style={{ background: COLORS.ink }} className="px-5 pt-6 pb-5 rounded-b-3xl">
            <div className="flex items-center justify-between">
              <div>
                <div style={{ color: COLORS.brassLight }} className="text-[11px] tracking-[0.2em] uppercase font-mono">Field Log</div>
                <div className="font-display text-white text-2xl mt-0.5">{myIdentity.name}</div>
              </div>
              <button onClick={() => setSwitching(true)} className="text-white/70 hover:text-white text-xs font-mono">switch</button>
            </div>
            <div className="flex mt-5 rounded-xl overflow-hidden border border-white/15">
              {["log", "team", "manager"].map((v) => (
                <button key={v} onClick={() => (v === "manager" ? (isManager ? setView("manager") : setShowManagerGate(true)) : setView(v))}
                  className="flex-1 py-2.5 text-sm font-medium"
                  style={{ background: view === v ? COLORS.brass : "transparent", color: view === v ? COLORS.ink : "rgba(255,255,255,0.75)" }}>
                  {v === "log" ? "Log Activity" : v === "team" ? "Team Board" : "Manager"}
                </button>
              ))}
            </div>
          </div>

          {view === "log" && (
            <LogView date={today} entry={myTodayEntry} pulse={pulse} targets={targets} saveError={saveError}
              onBump={bump} onToggleSocial={() => upsertField({ social: !myTodayEntry.social })} onNote={(note) => upsertField({ note })} />
          )}
          {view === "team" && (
            <TeamView date={today} todayTotals={todayTotals} socialToday={socialToday} teamCount={new Set(todayRows.map((e) => e.advisor_code)).size}
              leaderboard={leaderboard} trendData={trendData} funnelData={funnelData} myCode={myCode} loading={teamLoading} onRefresh={loadTeamData} />
          )}
          {view === "manager" && isManager && (
            <ManagerView date={today} roster={roster} teamEntries={teamEntries} loading={teamLoading} onRefresh={loadTeamData}
              missingToday={missingToday} loggedTodayCount={loggedTodayCount} targets={targets} onSaveTargets={saveTargets} />
          )}
        </div>
      )}
      {showManagerGate && <ManagerGate hasPin={hasManagerPin} onSubmit={unlockManager} onClose={() => setShowManagerGate(false)} />}
    </div>
  );
}

function Onboarding({ roster, onChoose, onCreate, cancelable, onCancel }) {
  const [mode, setMode] = useState("pick");
  const [target, setTarget] = useState(null);
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [newName, setNewName] = useState("");
  const [newCode, setNewCode] = useState("");

  const submitPin = () => {
    if (pin.trim().toLowerCase() === target.code.trim().toLowerCase()) onChoose({ name: target.name, code: target.code });
    else { setError("That code doesn't match. Try again."); setPin(""); }
  };
  const submitNew = async () => {
    const name = newName.trim(), code = newCode.trim();
    if (!name || !code) { setError("Enter your name and a code."); return; }
    if (code.length < 4) { setError("Your code needs to be at least 4 characters."); return; }
    const res = await onCreate({ name, code });
    if (!res.ok) setError(res.message);
  };

  if (mode === "pin" && target) {
    return (
      <div className="max-w-md mx-auto min-h-screen flex flex-col justify-center px-6 py-10">
        <div className="text-center mb-8">
          <div style={{ color: COLORS.ink }} className="font-display text-2xl">{target.name}</div>
          <div style={{ color: COLORS.slate }} className="text-sm mt-1">Enter your advisor code to continue</div>
        </div>
        <input value={pin} onChange={(e) => setPin(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitPin()} autoFocus
          style={{ borderColor: COLORS.line, background: COLORS.card, color: COLORS.ink }}
          className="w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 text-center text-xl font-mono" placeholder="Your code" />
        {error && <div style={{ color: COLORS.rust }} className="text-xs text-center mt-2">{error}</div>}
        <button onClick={submitPin} style={{ background: COLORS.ink }} className="w-full py-3 rounded-2xl text-white font-medium mt-4">Unlock</button>
        <button onClick={() => setMode("pick")} style={{ color: COLORS.slate }} className="mt-4 text-sm text-center underline">Back</button>
      </div>
    );
  }
  if (mode === "new") {
    return (
      <div className="max-w-md mx-auto min-h-screen flex flex-col justify-center px-6 py-10">
        <div className="text-center mb-8">
          <div style={{ color: COLORS.brass }} className="text-[11px] tracking-[0.25em] uppercase font-mono mb-2">New Advisor</div>
          <div style={{ color: COLORS.ink }} className="font-display text-3xl">Set up your log</div>
        </div>
        <div className="space-y-2">
          <input value={newName} onChange={(e) =>
