<script>
(function () {
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;
var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

var COLORS = {
  ink: "#1F3D34", inkLight: "#2E5548", parchment: "#EEF0E8", card: "#FBFBF7",
  brass: "#B8863B", brassLight: "#D9B26B", slate: "#52606D", rust: "#A3502B",
  line: "#DDE1D2", good: "#3E7A4C"
};

var METRICS = [
  { key: "prospecting", label: "New Prospects", short: "Prospecting", color: COLORS.slate },
  { key: "approaching", label: "Initial Approaches", short: "Approaching", color: COLORS.brassLight },
  { key: "relationship", label: "Relationship Touches", short: "Relationship", color: COLORS.inkLight },
  { key: "appts", label: "Appointments Set", short: "Appointments", color: COLORS.brass },
  { key: "presented", label: "Clients Presented", short: "Presented", color: COLORS.ink },
  { key: "closed", label: "Clients Closed", short: "Closed", color: COLORS.rust }
];

function todayStr(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function startOfWeek(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d.toISOString().slice(0, 10);
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
function shortDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function emptyEntry() {
  var row = { social: false, note: "" };
  METRICS.forEach(function (m) { row[m.key] = 0; });
  return row;
}
function entryTotal(e) {
  if (!e) return 0;
  return METRICS.reduce(function (s, m) { return s + (e[m.key] || 0); }, 0);
}
function lget(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (err) { return null; } }
function lset(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (err) {} }

function App() {
  var loadingState = useState(true); var loading = loadingState[0], setLoading = loadingState[1];
  var dbErrorState = useState(null); var dbError = dbErrorState[0], setDbError = dbErrorState[1];
  var myIdentityState = useState(lget("my-identity")); var myIdentity = myIdentityState[0], setMyIdentity = myIdentityState[1];
  var rosterState = useState([]); var roster = rosterState[0], setRoster = rosterState[1];
  var targetsState = useState({}); var targets = targetsState[0], setTargets = targetsState[1];
  var hasPinState = useState(false); var hasManagerPin = hasPinState[0], setHasManagerPin = hasPinState[1];
  var isManagerState = useState(!!lget("is-manager")); var isManager = isManagerState[0], setIsManager = isManagerState[1];
  var myEntriesState = useState({}); var myEntries = myEntriesState[0], setMyEntries = myEntriesState[1];
  var teamEntriesState = useState([]); var teamEntries = teamEntriesState[0], setTeamEntries = teamEntriesState[1];
  var teamLoadingState = useState(false); var teamLoading = teamLoadingState[0], setTeamLoading = teamLoadingState[1];
  var viewState = useState("log"); var view = viewState[0], setView = viewState[1];
  var switchingState = useState(false); var switching = switchingState[0], setSwitching = switchingState[1];
  var pulseState = useState(null); var pulse = pulseState[0], setPulse = pulseState[1];
  var showGateState = useState(false); var showManagerGate = showGateState[0], setShowManagerGate = showGateState[1];
  var saveErrorState = useState(false); var saveError = saveErrorState[0], setSaveError = saveErrorState[1];

  useEffect(function () {
    (async function () {
      var results = await Promise.all([
        sb.from("advisors").select("*").order("name"),
        sb.from("targets").select("*"),
        sb.rpc("has_manager_pin")
      ]);
      var rosterRes = results[0], targetRes = results[1], pinRes = results[2];
      if (rosterRes.error || targetRes.error || pinRes.error) {
        setDbError("Couldn't reach the database. Check that your Supabase URL and key are filled in at the top of index.html, and that schema.sql has been run.");
        setLoading(false);
        return;
      }
      setRoster(rosterRes.data || []);
      var tMap = {};
      (targetRes.data || []).forEach(function (t) { tMap[t.stage] = t.daily_target; });
      setTargets(tMap);
      setHasManagerPin(!!pinRes.data);

      if (myIdentity) {
        var er = await sb.from("entries").select("*").eq("advisor_code", myIdentity.code);
        var map = {};
        (er.data || []).forEach(function (row) { map[row.entry_date] = row; });
        setMyEntries(map);
      }
      setLoading(false);
    })();
  }, []);

  var loadTeamData = async function () {
    setTeamLoading(true);
    var res = await sb.from("entries").select("*");
    setTeamEntries(res.data || []);
    setTeamLoading(false);
  };

  useEffect(function () {
    if (view === "team" || view === "manager") loadTeamData();
  }, [view]);

  var chooseAdvisor = async function (identity) {
    setMyIdentity(identity);
    lset("my-identity", identity);
    setSwitching(false);
    var res = await sb.from("entries").select("*").eq("advisor_code", identity.code);
    var map = {};
    (res.data || []).forEach(function (row) { map[row.entry_date] = row; });
    setMyEntries(map);
  };

  var createAdvisor = async function (info) {
    var res = await sb.from("advisors").insert({ name: info.name, code: info.code });
    if (res.error) return { ok: false, message: res.error.code === "23505" ? "That code is already taken — pick another." : "Couldn't save. Try again." };
    setRoster(roster.concat([{ name: info.name, code: info.code }]));
    await chooseAdvisor({ name: info.name, code: info.code });
    return { ok: true };
  };

  var today = todayStr();
  var myCode = myIdentity ? myIdentity.code : undefined;
  var myTodayEntry = myEntries[today] || emptyEntry();

  var bump = async function (key, delta) {
    var optimistic = Object.assign({}, myTodayEntry);
    optimistic[key] = Math.max(0, (myTodayEntry[key] || 0) + delta);
    var newEntries = Object.assign({}, myEntries); newEntries[today] = optimistic;
    setMyEntries(newEntries);
    setPulse(key);
    setTimeout(function () { setPulse(null); }, 500);
    var res = await sb.rpc("bump_metric", { p_code: myCode, p_date: today, p_field: key, p_delta: delta });
    setSaveError(!!res.error);
    if (!res.error) {
      var row = await sb.from("entries").select("*").eq("advisor_code", myCode).eq("entry_date", today).single();
      if (row.data) setMyEntries(function (prev) { var next = Object.assign({}, prev); next[today] = row.data; return next; });
    }
  };

  var upsertField = async function (fields) {
    var updated = Object.assign({}, myTodayEntry, fields, { advisor_code: myCode, entry_date: today });
    var newEntries = Object.assign({}, myEntries); newEntries[today] = updated;
    setMyEntries(newEntries);
    var res = await sb.from("entries").upsert(updated, { onConflict: "advisor_code,entry_date" });
    setSaveError(!!res.error);
  };

  var saveTargets = async function (draft) {
    setTargets(draft);
    await Promise.all(Object.keys(draft).map(function (stage) {
      return sb.from("targets").upsert({ stage: stage, daily_target: draft[stage] }, { onConflict: "stage" });
    }));
  };

  var unlockManager = async function (pin) {
    if (!hasManagerPin) {
      var setRes = await sb.rpc("set_manager_pin_if_unset", { p_pin: pin });
      if (!setRes.data) return false;
      setHasManagerPin(true);
      setIsManager(true); lset("is-manager", true);
      setShowManagerGate(false); setView("manager");
      return true;
    }
    var checkRes = await sb.rpc("check_manager_pin", { p_candidate: pin });
    if (checkRes.data) {
      setIsManager(true); lset("is-manager", true);
      setShowManagerGate(false); setView("manager");
      return true;
    }
    return false;
  };

  var todayRows = teamEntries.filter(function (e) { return e.entry_date === today; });
  var todayTotals = {};
  METRICS.forEach(function (m) {
    todayTotals[m.key] = todayRows.reduce(function (s, e) { return s + (e[m.key] || 0); }, 0);
  });
  var socialToday = todayRows.filter(function (e) { return e.social; }).length;

  var weekStart = startOfWeek(today);
  var weekRows = teamEntries.filter(function (e) { return e.entry_date >= weekStart && e.entry_date <= today; });
  var board = {};
  weekRows.forEach(function (e) {
    if (!board[e.advisor_code]) {
      var advisor = roster.filter(function (r) { return r.code === e.advisor_code; })[0];
      board[e.advisor_code] = { code: e.advisor_code, name: advisor ? advisor.name : e.advisor_code, social: 0 };
    }
    METRICS.forEach(function (m) { board[e.advisor_code][m.key] = (board[e.advisor_code][m.key] || 0) + (e[m.key] || 0); });
    if (e.social) board[e.advisor_code].social += 1;
  });
  var leaderboard = Object.keys(board).map(function (k) { return board[k]; }).sort(function (a, b) {
    return (b.closed || 0) - (a.closed || 0) || (b.appts || 0) - (a.appts || 0);
  });

  var last7 = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return todayStr(-6 + i); });
  var trendData = last7.map(function (d) {
    var rows = teamEntries.filter(function (e) { return e.entry_date === d; });
    var point = { date: d, label: new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "short" }) };
    METRICS.forEach(function (m) { point[m.key] = rows.reduce(function (s, e) { return s + (e[m.key] || 0); }, 0); });
    return point;
  });

  var funnelData = METRICS.map(function (m) { return Object.assign({}, m, { value: todayTotals[m.key] || 0 }); });
  var missingToday = roster.filter(function (r) {
    return entryTotal(todayRows.filter(function (e) { return e.advisor_code === r.code; })[0]) === 0;
  });
  var loggedTodayCount = roster.length - missingToday.length;

  if (dbError) {
    return h("div", { style: { background: COLORS.parchment, minHeight: "100vh" }, className: "flex items-center justify-center px-6" },
      h("div", { style: { background: COLORS.card, borderColor: COLORS.line, color: COLORS.rust }, className: "max-w-sm rounded-2xl border p-5 text-sm" }, dbError)
    );
  }
  if (loading) {
    return h("div", { style: { background: COLORS.parchment, minHeight: "100vh" }, className: "flex items-center justify-center" },
      h("div", { style: { color: COLORS.ink }, className: "text-sm tracking-widest uppercase font-mono" }, "Loading ledger…")
    );
  }

  var showOnboarding = !myIdentity || switching;

  var mainBody = null;
  if (!showOnboarding) {
    var tabsRow = h("div", { className: "flex mt-5 rounded-xl overflow-hidden border border-white/15" },
      ["log", "team", "manager"].map(function (v) {
        return h("button", {
          key: v,
          onClick: function () { v === "manager" ? (isManager ? setView("manager") : setShowManagerGate(true)) : setView(v); },
          className: "flex-1 py-2.5 text-sm font-medium",
          style: { background: view === v ? COLORS.brass : "transparent", color: view === v ? COLORS.ink : "rgba(255,255,255,0.75)" }
        }, v === "log" ? "Log Activity" : v === "team" ? "Team Board" : "Manager");
      })
    );

    var header = h("div", { style: { background: COLORS.ink }, className: "px-5 pt-6 pb-5 rounded-b-3xl" },
      h("div", { className: "flex items-center justify-between" },
        h("div", null,
          h("div", { style: { color: COLORS.brassLight }, className: "text-[11px] tracking-[0.2em] uppercase font-mono" }, "Field Log"),
          h("div", { className: "font-display text-white text-2xl mt-0.5" }, myIdentity.name)
        ),
        h("button", { onClick: function () { setSwitching(true); }, className: "text-white/70 hover:text-white text-xs font-mono" }, "switch")
      ),
      tabsRow
    );

    mainBody = h("div", { className: "max-w-md mx-auto pb-10" },
      header,
      view === "log" && h(LogView, {
        date: today, entry: myTodayEntry, pulse: pulse, targets: targets, saveError: saveError,
        onBump: bump, onToggleSocial: function () { upsertField({ social: !myTodayEntry.social }); }, onNote: function (note) { upsertField({ note: note }); }
      }),
      view === "team" && h(TeamView, {
        date: today, todayTotals: todayTotals, socialToday: socialToday,
        teamCount: new Set(todayRows.map(function (e) { return e.advisor_code; })).size,
        leaderboard: leaderboard, trendData: trendData, funnelData: funnelData, myCode: myCode, loading: teamLoading, onRefresh: loadTeamData
      }),
      view === "manager" && isManager && h(ManagerView, {
        date: today, roster: roster, teamEntries: teamEntries, loading: teamLoading, onRefresh: loadTeamData,
        missingToday: missingToday, loggedTodayCount: loggedTodayCount, targets: targets, onSaveTargets: saveTargets
      })
    );
  }

  return h("div", { style: { background: COLORS.parchment, minHeight: "100vh" } },
    showOnboarding
      ? h(Onboarding, { roster: roster, onChoose: chooseAdvisor, onCreate: createAdvisor, cancelable: !!myIdentity, onCancel: function () { setSwitching(false); } })
      : mainBody,
    showManagerGate && h(ManagerGate, { hasPin: hasManagerPin, onSubmit: unlockManager, onClose: function () { setShowManagerGate(false); } })
  );
}

function Onboarding(props) {
  var roster = props.roster, onChoose = props.onChoose, onCreate = props.onCreate, cancelable = props.cancelable, onCancel = props.onCancel;
  var modeState = useState("pick"); var mode = modeState[0], setMode = modeState[1];
  var targetState = useState(null); var target = targetState[0], setTarget = targetState[1];
  var pinState = useState(""); var pin = pinState[0], setPin = pinState[1];
  var errorState = useState(""); var error = errorState[0], setError = errorState[1];
  var newNameState = useState(""); var newName = newNameState[0], setNewName = newNameState[1];
  var newCodeState = useState(""); var newCode = newCodeState[0], setNewCode = newCodeState[1];

  var submitPin = function () {
    if (pin.trim().toLowerCase() === target.code.trim().toLowerCase()) onChoose({ name: target.name, code: target.code });
    else { setError("That code doesn't match. Try again."); setPin(""); }
  };
  var submitNew = async function () {
    var name = newName.trim(), code = newCode.trim();
    if (!name || !code) { setError("Enter your name and a code."); return; }
    if (code.length < 4) { setError("Your code needs to be at least 4 characters."); return; }
    var res = await onCreate({ name: name, code: code });
    if (!res.ok) setError(res.message);
  };

  if (mode === "pin" && target) {
    return h("div", { className: "max-w-md mx-auto min-h-screen flex flex-col justify-center px-6 py-10" },
      h("div", { className: "text-center mb-8" },
        h("div", { style: { color: COLORS.ink }, className: "font-display text-2xl" }, target.name),
        h("div", { style: { color: COLORS.slate }, className: "text-sm mt-1" }, "Enter your advisor code to continue")
      ),
      h("input", {
        value: pin, onChange: function (ev) { setPin(ev.target.value); },
        onKeyDown: function (ev) { if (ev.key === "Enter") submitPin(); }, autoFocus: true,
        style: { borderColor: COLORS.line, background: COLORS.card, color: COLORS.ink },
        className: "w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 text-center text-xl font-mono", placeholder: "Your code"
      }),
      error && h("div", { style: { color: COLORS.rust }, className: "text-xs text-center mt-2" }, error),
      h("button", { onClick: submitPin, style: { background: COLORS.ink }, className: "w-full py-3 rounded-2xl text-white font-medium mt-4" }, "Unlock"),
      h("button", { onClick: function () { setMode("pick"); }, style: { color: COLORS.slate }, className: "mt-4 text-sm text-center underline" }, "Back")
    );
  }
  if (mode === "new") {
    return h("div", { className: "max-w-md mx-auto min-h-screen flex flex-col justify-center px-6 py-10" },
      h("div", { className: "text-center mb-8" },
        h("div", { style: { color: COLORS.brass }, className: "text-[11px] tracking-[0.25em] uppercase font-mono mb-2" }, "New Advisor"),
        h("div", { style: { color: COLORS.ink }, className: "font-display text-3xl" }, "Set up your log")
      ),
      h("div", { className: "space-y-2" },
        h("input", { value: newName, onChange: function (ev) { setNewName(ev.target.value); }, placeholder: "Full name",
          style: { borderColor: COLORS.line, background: COLORS.card, color: COLORS.ink }, className: "w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2" }),
        h("input", { value: newCode, onChange: function (ev) { setNewCode(ev.target.value); }, onKeyDown: function (ev) { if (ev.key === "Enter") submitNew(); }, placeholder: "Advisor code",
          style: { borderColor: COLORS.line, background: COLORS.card, color: COLORS.ink }, className: "w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 font-mono" }),
        error && h("div", { style: { color: COLORS.rust }, className: "text-xs" }, error),
        h("div", { style: { color: COLORS.slate }, className: "text-[11px] leading-relaxed pt-1" }, "Your code is also your login from now on — keep it to yourself."),
        h("button", { onClick: submitNew, style: { background: COLORS.ink }, className: "w-full py-3 rounded-2xl text-white font-medium mt-2" }, "Create my log")
      ),
      h("button", { onClick: function () { setError(""); setMode("pick"); }, style: { color: COLORS.slate }, className: "mt-6 text-sm text-center underline" }, "Back")
    );
  }
  return h("div", { className: "max-w-md mx-auto min-h-screen flex flex-col justify-center px-6 py-10" },
    h("div", { className: "text-center mb-8" },
      h("div", { style: { color: COLORS.brass }, className: "text-[11px] tracking-[0.25em] uppercase font-mono mb-2" }, "Advisor Activity Ledger"),
      h("div", { style: { color: COLORS.ink }, className: "font-display text-3xl" }, "Who's logging in?")
    ),
    roster.length > 0 && h("div", { className: "space-y-2 mb-6" },
      roster.map(function (r) {
        return h("button", {
          key: r.code,
          onClick: function () { setTarget(r); setPin(""); setError(""); setMode("pin"); },
          style: { background: COLORS.card, borderColor: COLORS.line },
          className: "w-full text-left px-4 py-3.5 rounded-2xl border flex items-center justify-between"
        }, h("div", { style: { color: COLORS.ink }, className: "font-medium" }, r.name));
      })
    ),
    h("button", { onClick: function () { setError(""); setMode("new"); }, style: { borderColor: COLORS.line, color: COLORS.ink }, className: "w-full py-3.5 rounded-2xl border border-dashed font-medium text-sm" }, "+ I'm new here"),
    cancelable && h("button", { onClick: onCancel, style: { color: COLORS.slate }, className: "mt-6 text-sm text-center underline" }, "Cancel")
  );
}

function ManagerGate(props) {
  var hasPin = props.hasPin, onSubmit = props.onSubmit, onClose = props.onClose;
  var pinState = useState(""); var pin = pinState[0], setPin = pinState[1];
  var confirmState = useState(""); var confirm = confirmState[0], setConfirm = confirmState[1];
  var errorState = useState(""); var error = errorState[0], setError = errorState[1];
  var submit = async function () {
    if (!hasPin) {
      if (!/^\d{4}$/.test(pin)) { setError("Choose a 4-digit PIN."); return; }
      if (pin !== confirm) { setError("PINs don't match."); return; }
      await onSubmit(pin);
    } else {
      var ok = await onSubmit(pin);
      if (!ok) { setError("Incorrect PIN."); setPin(""); }
    }
  };
  return h("div", { className: "fixed inset-0 flex items-center justify-center px-6", style: { background: "rgba(31,61,52,0.55)" } },
    h("div", { style: { background: COLORS.card }, className: "w-full max-w-sm rounded-3xl p-6 relative" },
      h("button", { onClick: onClose, className: "absolute top-4 right-4", style: { color: COLORS.slate } }, "✕"),
      h("div", { style: { color: COLORS.ink }, className: "font-display text-xl mb-1" }, hasPin ? "Manager access" : "Set up manager access"),
      h("div", { style: { color: COLORS.slate }, className: "text-sm mb-4" }, hasPin ? "Enter the manager PIN." : "Set this once — anyone with it can see every advisor's history."),
      h("input", {
        value: pin, onChange: function (ev) { setPin(ev.target.value.replace(/\D/g, "").slice(0, 4)); }, inputMode: "numeric", autoFocus: true, placeholder: "••••",
        style: { borderColor: COLORS.line, background: COLORS.parchment, color: COLORS.ink, letterSpacing: "0.5em" },
        className: "w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 text-center text-xl font-mono mb-2"
      }),
      !hasPin && h("input", {
        value: confirm, onChange: function (ev) { setConfirm(ev.target.value.replace(/\D/g, "").slice(0, 4)); }, onKeyDown: function (ev) { if (ev.key === "Enter") submit(); }, inputMode: "numeric", placeholder: "Confirm PIN",
        style: { borderColor: COLORS.line, background: COLORS.parchment, color: COLORS.ink, letterSpacing: "0.5em" },
        className: "w-full px-4 py-3 rounded-2xl border outline-none focus:ring-2 text-center text-xl font-mono mb-2"
      }),
      error && h("div", { style: { color: COLORS.rust }, className: "text-xs mb-2" }, error),
      h("button", { onClick: submit, style: { background: COLORS.ink }, className: "w-full py-3 rounded-2xl text-white font-medium mt-2" }, hasPin ? "Unlock" : "Set PIN & continue")
    )
  );
}

function LogView(props) {

function ManagerView(props) {
